# ComControl with the real controller. Copy .env.example to .env and adjust.
# No privileged mode: the container gets access to hidraw character devices
# through a device cgroup rule, sees the host's /dev read-only under /hostdev
# (so a reconnect with a new /dev/hidrawN number is visible without a restart)
# and can open only nodes that the host's udev rule grants to COMCONTROL_GID.
services:
  comcontrol:
    # Published by the GitHub release workflow. To build locally instead:
    #   docker compose -f compose.yaml -f compose.build.yaml up -d --build
    image: ghcr.io/memc0re/comcontrol:latest
    restart: unless-stopped
    ports:
      - "${COMCONTROL_BIND:-127.0.0.1}:${COMCONTROL_PORT:-8080}:8080"
    environment:
      COMCONTROL_USB_PATH: ${COMCONTROL_USB_PATH:-}
      COMCONTROL_DEV_DIR: /hostdev
      COMCONTROL_ALLOWED_HOSTS: ${COMCONTROL_ALLOWED_HOSTS:-}
    volumes:
      - comcontrol-data:/data
      - /dev:/hostdev:ro
    device_cgroup_rules:
      - "c ${HIDRAW_MAJOR:?set HIDRAW_MAJOR to the hidraw major number from /proc/devices}:* rw"
    group_add:
      - "${COMCONTROL_GID:?set COMCONTROL_GID to the group of the controller's hidraw node}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  comcontrol-data:
